openapi: 3.0.3
info:
  title: Petstore PoC
  version: 1.0.0
  description: Small spec used to test the postman-mock plugin.
servers:
  - url: https://api.example.com/v1
tags:
  - name: pets
  - name: auth
paths:
  /pets:
    get:
      tags: [pets]
      operationId: listPets
      summary: List pets
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: status
          in: query
          schema: { type: string, enum: [available, sold] }
      responses:
        '200':
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pet' }
              example:
                - { id: 1, name: Milo, status: available }
                - { id: 2, name: Luna, status: sold }
    post:
      tags: [pets]
      operationId: createPet
      summary: Create a pet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewPet' }
            example: { name: Milo, status: available }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
              example: { id: 3, name: Milo, status: available }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: VALIDATION_ERROR, message: name is required }
  /pets/{petId}:
    get:
      tags: [pets]
      operationId: getPet
      summary: Get a pet by id
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The pet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
              example: { id: 1, name: Milo, status: available }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: PET_NOT_FOUND, message: Pet not found }
    delete:
      tags: [pets]
      operationId: deletePet
      summary: Delete a pet
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Deleted
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
            example: { email: user@example.com, password: secret }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expiresIn: { type: integer }
              example: { token: eyJhbGciOi.example, expiresIn: 3600 }
        '401':
          description: Wrong credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: INVALID_CREDENTIALS, message: Email or password is incorrect }
components:
  schemas:
    Pet:
      type: object
      required: [id, name, status]
      properties:
        id: { type: integer }
        name: { type: string }
        status: { type: string, enum: [available, sold] }
    NewPet:
      type: object
      required: [name]
      properties:
        name: { type: string }
        status: { type: string, enum: [available, sold] }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
